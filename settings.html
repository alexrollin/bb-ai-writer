<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Bebond AI Writer — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; margin-bottom: 20px; color: #4a4aff; }
    h2 { font-size: 14px; margin: 16px 0 8px; color: #888; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    .field select, .field input {
      width: 100%; padding: 8px 10px; background: #0f3460; border: 1px solid #2a2a5a;
      border-radius: 6px; color: #e0e0e0; font-size: 13px;
    }
    .field select:focus, .field input:focus { outline: none; border-color: #4a4aff; }
    .btn {
      padding: 8px 16px; border: 1px solid #4a4aff; border-radius: 6px;
      background: #4a4aff; color: #fff; font-size: 13px; cursor: pointer; margin-right: 8px;
    }
    .btn:hover { background: #3a3aee; }
    .btn-danger { background: #ff4a4a; border-color: #ff4a4a; }
    .btn-danger:hover { background: #dd3333; }
    .debug-log {
      width: 100%; height: 150px; background: #0f3460; border: 1px solid #2a2a5a;
      border-radius: 6px; color: #888; font-family: monospace; font-size: 11px;
      padding: 8px; margin-top: 8px; resize: vertical;
    }
  </style>
</head>
<body>
  <h1>[bb] Bebond AI Writer — Settings</h1>

  <h2>Agent</h2>
  <div class="field">
    <label for="opt-agent">Default agent</label>
    <select id="opt-agent">
      <option value="sove-da">Sove Directory Agent</option>
    </select>
  </div>

  <h2>Locale</h2>
  <div class="field">
    <label for="opt-locale">Voice / draft locale</label>
    <select id="opt-locale">
      <option value="nl-NL">Nederlands (nl-NL)</option>
      <option value="en-US">English (en-US)</option>
    </select>
  </div>

  <h2>Debug</h2>
  <div class="field">
    <label>
      <input type="checkbox" id="opt-debug"> Enable debug logging
    </label>
  </div>
  <textarea class="debug-log" id="debug-log" readonly placeholder="Debug output appears here when enabled..."></textarea>

  <h2>Account</h2>
  <div style="margin-top: 12px;">
    <button class="btn" id="btn-save">Save settings</button>
    <button class="btn btn-danger" id="btn-disconnect">Disconnect Bebond</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
